<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07090d">
    <title>Signing In | The District</title>
    <link rel="stylesheet" href="css/community-hub.css">
</head>
<body class="district-login-page">
<div class="auth-bridge" id="authBridge">
    <img src="assets/images/logo.png" alt="The District">
    <span>DISCORD SIGN-IN</span>
    <h1>Connecting your account</h1>
    <p>Checking your District membership...</p>
</div>
<script>
const API_URL = "https://the-district-api.danielclifford2808.workers.dev";
async function handleLogin() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    if (!code) { window.location.replace("/index.html"); return; }

    try {
        const response = await fetch(`${API_URL}/api/auth/callback`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code })
        });
        const data = await response.json();
        if (!response.ok || !data.success || !data.token) throw new Error(data.error || "Login failed.");
        localStorage.setItem("district_session", data.token);

        const returnPath = sessionStorage.getItem("district_return_path");
        sessionStorage.removeItem("district_return_path");
        window.location.replace(returnPath || "/pages/about.html");
    } catch (error) {
        console.error(error);
        document.getElementById("authBridge").innerHTML = `
            <img src="assets/images/logo.png" alt="The District">
            <span>SIGN-IN ERROR</span>
            <h1>We couldn't sign you in</h1>
            <p>${String(error.message || "Please try again.")}</p>
            <p><a class="hub-button primary" href="/index.html">Try Again</a></p>
        `;
    }
}
handleLogin();
</script>
</body>
</html>
